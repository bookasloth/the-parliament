version: 2
updates:
  # npm dependencies — weekly, grouped to reduce PR noise. Security updates are
  # raised immediately regardless of schedule.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions (checkout, setup-node, codeql-action, …) patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
