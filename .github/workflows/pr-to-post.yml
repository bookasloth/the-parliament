name: PR merge → feed post

on:
  pull_request:
    types: [closed]

jobs:
  post:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create feed post from merged PR
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TARGET: ${{ vars.CRON_TARGET_URL || 'https://nnawca.vercel.app' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "::error::WEBHOOK_SECRET repo secret is not set"
            exit 1
          fi

          BODY_TRUNC=$(printf '%s' "$PR_BODY" | head -c 1000)

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --argjson number "$PR_NUMBER" \
            --arg url "$PR_URL" \
            --arg merged_by "$PR_MERGED_BY" \
            --arg body "$BODY_TRUNC" \
            '{title: $title, number: $number, url: $url, merged_by: $merged_by, body: $body}')

          # Retry with backoff — Vercel needs time to deploy the merge commit
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt..."
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "${TARGET}/api/webhooks/github-pr") || true

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "Success: $(cat /tmp/resp.txt)"
              exit 0
            fi

            echo "Got HTTP $HTTP_CODE: $(cat /tmp/resp.txt)"
            if [ "$attempt" -lt 4 ]; then
              WAIT=$((attempt * 45))
              echo "Waiting ${WAIT}s for Vercel deploy..."
              sleep "$WAIT"
            fi
          done

          echo "::error::All attempts failed (last HTTP $HTTP_CODE)"
          exit 1
